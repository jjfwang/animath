<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teachkit — Interactive Water Cycle Pilot</title>
<link rel="stylesheet" href="interactive.css">
<style>body{margin:0;padding:24px 12px;background:#f4f7f9;font-family:system-ui,sans-serif} .shell{max-width:960px;margin:auto}.status{margin:12px 0;color:#435565}</style>
</head>
<body>
<main class="shell">
  <div id="status" class="status" role="status">Loading water-cycle lesson…</div>
  <div id="interactive"></div>
</main>
<script src="interactive.js"></script>
<script>
(function () {
  'use strict';
  var status = document.getElementById('status');
  var mountPoint = document.getElementById('interactive');
  fetch('../samples/interactive/secondary-science-water-cycle.json').then(function (response) {
    if (!response.ok) throw new Error('Cannot load interactive sample (' + response.status + ')');
    return response.json();
  }).then(function (spec) {
    var tutor = TeachkitInteractive.mount(mountPoint, spec);
    window.teachkitTutor = tutor; // demo integration: tutor.playBeat('condensation','tutor')
    status.textContent = 'Explore the water cycle. Use the phase buttons and sliders, then answer the question.';
  }).catch(function (error) {
    status.textContent = 'Unable to load lesson: ' + error.message;
  });
})();
</script>
</body>
</html>
